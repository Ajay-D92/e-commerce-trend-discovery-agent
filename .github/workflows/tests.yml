name: tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Stage tests
        run: |
          cd stages
          for f in *.test.js; do
            echo "== $f"
            node "$f" || exit 1
          done
      - name: Guardrail eval
        run: node eval/run_guardrail_eval.js
